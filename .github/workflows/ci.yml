name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.22', oldstable, stable]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Version
        run: go version

      - name: Format
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: Vet
        run: |
          go vet ./...
          go vet -tags integration ./...

      - name: Test
        run: go test -race -count=1 -v ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...
          staticcheck -tags integration ./...

  integration:
    name: Test-mode run
    runs-on: ubuntu-latest
    needs: test
    env:
      AGILIS_TEST_API_KEY: ${{ secrets.AGILIS_TEST_API_KEY }}
    steps:
      - name: Skip without a Test key
        if: env.AGILIS_TEST_API_KEY == ''
        run: echo "AGILIS_TEST_API_KEY is not set, so the Test-mode run is skipped."

      - name: Refuse a Live key
        if: startsWith(env.AGILIS_TEST_API_KEY, 'pk_live_')
        run: |
          echo "AGILIS_TEST_API_KEY is a Live key. The Test-mode run only uses Test keys."
          exit 1

      - uses: actions/checkout@v4
        if: env.AGILIS_TEST_API_KEY != ''

      - uses: actions/setup-go@v5
        if: env.AGILIS_TEST_API_KEY != ''
        with:
          go-version: stable

      - name: Test-mode run
        if: env.AGILIS_TEST_API_KEY != ''
        run: go test -tags integration -count=1 -v -run Integration ./...
